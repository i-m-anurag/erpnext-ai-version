# Frontend container nginx: serves the Angular SPA and proxies /api to the backend
# container over the compose network. This is what makes ONE domain serve both the
# app and the API — the host nginx only needs to point at this container.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # `api` is the compose service name; 3100 is the backend's fixed internal port.
  location /api/ {
    proxy_pass http://api:3100;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Hashed build assets — cache hard.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # SPA routing — everything else falls back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml font/woff2;

  # index.html must never be cached, or clients pin a stale bundle across deploys.
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
